---
layout: none
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: &quot;en&quot; }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ &quot;/assets/css/style.css&quot; | relative_url }}">
    <!-- KaTeX CDN (Cloudflare) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"
      onload="renderMathInElement(document.body, {
        delimiters: [
          {left: &#39;$$&#39;, right: &#39;$$&#39;, display: true},
          {left: &#39;$&#39;, right: &#39;$&#39;, display: false}
        ],
        strict: false
      });"></script>
  </head>
  <body>
    <div id="container">
      <header>
        <h1><a href="{{ &quot;/&quot; | relative_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
      </header>
      <section>
        {{ content }}
      </section>
      <footer>
        <p>Generated by <a href="https://pages.github.com">GitHub Pages</a></p>
      </footer>
    </div>
  </body>
</html>
